quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.driver=org.h2.Driver
quarkus.datasource.username=admin
quarkus.datasource.password=admin@codeflix-admin-catalog-database
quarkus.datasource.jdbc.url=jdbc:h2:file:./target/h2db/codeflix-admin-catalog-testdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=MYSQL;DATABASE_TO_LOWER=TRUE
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.log.console.enable=true
quarkus.log.console.level=INFO
quarkus.log.file.enable=true
quarkus.log.file.level=DEBUG
quarkus.log.file.path=target/quarkus.log